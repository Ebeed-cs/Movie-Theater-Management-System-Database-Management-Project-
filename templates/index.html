<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../static/css/style.css" />
    <title>Cinema Ali Baba</title>
  </head>
  <body>
    <main>
      <section class="section">
        <h2 class="section-text">Cinema Ali Baba</h2>
        <div class="section-search">
          <form action="{{ url_for('search_movie') }}" method="get">
            <div>
              <label for="film_name">Search by film name</label>
              <input type="text" name="film_name" placeholder="Search" />
              <button type="submit">Search</button>
            </div>
          </form>
        </div>
        {% if error %}
        <p>{{ error }}</p>
        {% endif %}
      </section>
    </main>
  </body>
</html>
